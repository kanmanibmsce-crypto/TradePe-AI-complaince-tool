<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TradePe &mdash; Sign In</title>
  <link rel="stylesheet" href="/static/style.css" />
  <style>
    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
    }
    .login-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 400px;
    }
    .login-brand {
      text-align: center;
      margin-bottom: 2rem;
    }
    .login-brand .logotype {
      display: block;
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--navy);
      letter-spacing: -0.02em;
    }
    .login-brand .tagline {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .login-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 1.5rem;
      text-align: center;
    }
    .form-group {
      margin-bottom: 1rem;
    }
    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 0.35rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .form-group input {
      width: 100%;
      padding: 0.6rem 0.75rem;
      border: 1px solid var(--border-dark);
      border-radius: var(--radius);
      font-size: 0.9rem;
      color: var(--text);
      background: var(--white);
      outline: none;
      transition: border-color var(--transition);
    }
    .form-group input:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(13,148,136,.12);
    }
    .btn-login {
      width: 100%;
      padding: 0.65rem 1rem;
      background: var(--teal);
      color: var(--white);
      border: none;
      border-radius: var(--radius);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background var(--transition);
    }
    .btn-login:hover { background: var(--teal-dark); }
    .login-error {
      background: var(--red-bg);
      color: var(--red);
      border: 1px solid #fca5a5;
      border-radius: var(--radius);
      padding: 0.6rem 0.75rem;
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }
    .demo-hint {
      margin-top: 1.25rem;
      padding: 0.75rem;
      background: var(--teal-light);
      border-radius: var(--radius);
      font-size: 0.8rem;
      color: var(--teal-dark);
    }
    .demo-hint strong { display: block; margin-bottom: 4px; }
    .demo-hint code {
      background: rgba(13,148,136,.12);
      padding: 1px 5px;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-brand">
        <span class="logotype">TradePe</span>
        <span class="tagline">AI Compliance Copilot</span>
      </div>

      <h1 class="login-title">Sign in to your account</h1>

      {% if error %}
      <div class="login-error" role="alert" id="login-error">{{ error }}</div>
      {% endif %}

      <form method="POST" action="/login" novalidate>
        <div class="form-group">
          <label for="username">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter username"
            autocomplete="username"
            required
            autofocus
          />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter password"
            autocomplete="current-password"
            required
          />
        </div>
        <button type="submit" class="btn-login" id="btn-signin">Sign In</button>
      </form>

      <div class="demo-hint">
        <strong>Demo credentials</strong>
        Admin: <code>admin</code> / <code>Admin123!</code><br/>
        Analyst: <code>analyst</code> / <code>Analyst123!</code>
      </div>
    </div>
  </div>
</body>
</html>
